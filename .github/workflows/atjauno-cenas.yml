# Atjauno cenas.json no Elering publiskā API.
# Jauni (rītdienas) dati parādās ap 13:30–14:00 Rīgas laikā; croni ir UTC:
#   11:20 UTC = 14:20 EEST (vasara) — galvenais gājiens
#   12:20 UTC = rezerve, ja pirmajā vēl nebija; ziemā (EET) šis ir 14:20
#   01:15 UTC = rīta gājiens — datu logs pārbīdās uz jauno dienu
# GitHub cron kavē par 3–9 h (mērīts 2026-09..11), tāpēc galvenais palaidējs
# ir M19 Mac mini (palaid-atjauno.sh, 14:15/15:15/16:30 Rīgā, workflow_dispatch);
# šie croni paliek kā rezerve.
name: Atjauno cenas

on:
  schedule:
    - cron: "20 11 * * *"
    - cron: "20 12 * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atjauno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paņem cenas no Elering
        run: python3 atjauno_cenas.py
      - name: Iekomitē, ja mainījies
        run: |
          if git diff --quiet cenas.json 2>/dev/null && [ -f cenas.json ]; then
            echo "cenas.json nav mainījies — nekas nav jādara"
            exit 0
          fi
          git config user.name "cenu-robots"
          git config user.email "actions@users.noreply.github.com"
          git add cenas.json
          git commit -m "Cenas $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
